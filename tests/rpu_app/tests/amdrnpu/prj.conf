#
# Phase 1 link A overlay. Layered on top of tests/common/prj.conf
# (CPP, libcpp, USERSPACE, heap, clock WA, logging, stack sizes).

# Enable link A slave transport + amdrnpu endpoint compilation.
# src/driver/CMakeLists.txt gates apu_rpmsg_platform.c and
# amdrnpu_endpoint.c on this single switch; their SYS_INIT
# hooks then auto-register the endpoint at APPLICATION priority.
CONFIG_AMDRNPU_APU_RPMSG_SLAVE=y

# R52 DDR-boot reset vector.
#
# The Zephyr default (CONFIG_KERNEL_ENTRY="__start") sets the ELF
# e_entry to z_arm_reset, which for this image lands at an unaligned
# address inside .text (e.g. 0x00804f10). The 6.18-xilinx
# xlnx_r5_remoteproc driver programs the R52 reset-vector-base (RVBAR)
# register directly from the ELF e_entry via IOCTL_RPU_BOOT_ADDR_CONFIG;
# an unaligned address is rejected by the PLM/PM firmware:
#     failed to set RPU Boot address 0x804f10 ... err -22
#
# Point e_entry at _vector_table (the very base of apu_rpmsg_fw @
# 0x00800000, 1 MiB-aligned) instead. The R52 comes out of reset at
# RVBAR = 0x00800000, executes the reset branch in the vector table,
# and jumps on to z_arm_reset normally. remoteproc still LOADS the ELF
# by program headers (p_paddr), so only the boot address changes.
# This also matches the ddrboot@800000 carveout base, so drivers that
# derive the boot address from the carveout instead of e_entry agree.
CONFIG_KERNEL_ENTRY="_vector_table"

# This target is C-only; turn off the heavy C++ pulled in by
# tests/common/prj.conf for the XRT-lite tests.
CONFIG_CPP=n
CONFIG_STD_CPP17=n
CONFIG_REQUIRES_FULL_LIBCPP=n
CONFIG_CPP_EXCEPTIONS=n

# Phase-1 noise floor: enable amdrnpu driver debug printk so link A
# init and amdrnpu endpoint registration land in the RPU console —
# easy pass/fail signal in the boot log.
CONFIG_AMDRNPU_VERBOSE=y
