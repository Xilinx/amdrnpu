CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_SIZE_OPTIMIZATIONS=y

CONFIG_USERSPACE=y
CONFIG_HEAP_MEM_POOL_SIZE=512000
CONFIG_APPLICATION_DEFINED_SYSCALL=y

#WA till 2026.1 xsct is addressed, remove later
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100001817
CONFIG_PRIVILEGED_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# tessai driver verbosity: set to y to enable driver-side debug printk
# CONFIG_TESSAI_VERBOSE is not set
