# rpmsg-lite DMA echo test - shared memory map (parsed by host + a78).
# Numbers accept 0x.. hex. Keep host and A78 pointed at the SAME file/values.
#
# Address model: all ring/buffer addresses are in the "device-address" namespace
# based at dev_base (== rpmsg_lite_dma shm_phys == MDB5 pwrite/pread offset).
# The A78 reaches the same bytes via /dev/mem at a78_phys_base and translates
#   device_addr -> a78_phys_base + (device_addr - dev_base).
# If the address-equality bring-up step shows x86 and A78 see the same OCM
# address, leave dev_base == a78_phys_base (identity).

dev_base        = 0xBBF00000   # OCM bank base as seen over MDB5 (x86 side)
a78_phys_base   = 0xBBF00000   # same OCM bank base as seen by A78 /dev/mem
shm_size        = 0x80000      # 512 KiB bank (bounds checking)

status_offset   = 0x0
vring_tx_offset = 0x1000        # driver TX  (A78 device consumes "ping")
vring_rx_offset = 0x2000        # driver RX  (A78 device produces "pong")
buf_offset      = 0x4000        # buffer pool start
vring_num       = 4
vring_align     = 64
buf_count       = 8             # 4 RX + 4 TX
buf_size        = 512           # includes 16-byte rpmsg header

peer_dst        = 42            # addr the host sends "ping" to
host_ept_addr   = 1024          # driver ept addr; A78 echoes "pong" back here
iters           = 16            # host echo iterations
ept_name        = echo

mdb5_write      = /dev/mdb5_write00   # x86 MEM_TO_DEV channel
mdb5_read       = /dev/mdb5_read00    # x86 DEV_TO_MEM channel
