# SPDX-License-Identifier: MIT
# =============================================================================
# x86 PCIe-DMA XRT/AIE offload config (xrt_offload_host).
# Numbers accept 0x.. hex. Comments start with '#' or ';'. [sections] are
# ignored (flat key=value namespace).
#
# Two device regions, both reached over the MDB5 DMA channels:
#   1. Link A rpmsg vring region  (dev_base ..)  — the OpenAMP vrings/buffers
#      the RPU_APP firmware services (apu_rsctbl, OCM bank 1).
#   2. Device-memory buffer pools (rpu/device)   — ELF/descriptor/result and
#      kernel-arg buffers, DMA'd in by absolute PA.
#
# >>> Halt the APU (Linux) before running: the pools live in rpu_gem_cma DDR
# >>> (0x20000000..), which Linux otherwise owns. With the APU halted there is
# >>> no contention and no no-map requirement.
# =============================================================================

# ---- MDB5 DMA channel device nodes (x86 side) -------------------------------
mdb5_write      = /dev/mdb5_write00    # MEM_TO_DEV (host -> device)
mdb5_read       = /dev/mdb5_read00     # DEV_TO_MEM (device -> host)

# ---- Link A rpmsg vring region (device addresses) ---------------------------
# apu_rsctbl @ OCM bank 1 (RPURuntime reserved.dtsi). The leader (this host)
# consumes vring0 (RPU_APP TX) and produces vring1 (RPU_APP RX).
dev_base        = 0xBBF80000           # rpmsg_lite_dma shm_phys / MDB5 base
shm_size        = 0x49000              # apu_rsctbl MPU span
status_offset   = 0x2C                 # virtio status byte (0x30 if RAM_CONSOLE)
vring_rx_offset = 0x1000               # vring0 @ 0xBBF81000 (RPU_APP produces)
vring_tx_offset = 0x5000               # vring1 @ 0xBBF85000 (leader produces)
buf_offset      = 0x9000               # rpmsg buffer pool @ 0xBBF89000
vring_num       = 8
vring_align     = 16
buf_size        = 512
buf_count       = 16                   # 2 * vring_num

# ---- rpmsg endpoint ---------------------------------------------------------
ept_name        = amdrnpu              # channel the RPU firmware announces
host_ept_addr   = 1024                 # our local ept address
peer_dst        = 1024                 # RPU_APP "amdrnpu" ept addr (first dynamic ept = 1024; confirm via RPU "[apu-ept] ... addr=" log)

# ---- Device-memory buffer pools (absolute device PAs) -----------------------
# rpu pool  : ELF / descriptor / result  — the RPU dereferences these by PA, so
#             they MUST be RPU-reachable (rpu_gem_cma) and < 4 GiB.
# device pool: IFM / OFM / WTS / spill    — fetched by the AIE DMA by PA.
rpu_pool_base   = 0x20000000
rpu_pool_size   = 0x08000000           # 128 MiB
dev_pool_base   = 0x28000000
dev_pool_size   = 0x08000000           # 128 MiB
