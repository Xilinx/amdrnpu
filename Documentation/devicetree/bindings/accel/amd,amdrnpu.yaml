%YAML 1.2
---
$id: http://devicetree.org/schemas/accel/amd,amdrnpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD amdrnpu - RPU management interface

maintainers:
  - AMD <linux-amd@amd.com>

description: |
  The amd,amdrnpu node represents an AMD accelerator control interface. The
  accelerator firmware runs on an on-chip RPU, referenced by amd,rpu.

  The device provides buffer allocation from the specified accelerator and
  firmware shared memory regions.

  Each instance is associated with exactly one RPU via amd,rpu.

properties:
  compatible:
    const: amd,amdrnpu

  amd,rpu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the RPU that runs the accelerator firmware.

  memory-region:
    minItems: 1
    maxItems: 2
    description:
      Phandles to the accelerator and firmware shared memory regions, paired
      one-to-one with memory-region-names.

  memory-region-names:
    minItems: 1
    maxItems: 2
    items:
      enum: [ device, firmware ]
    description: Names of the memory regions.

  iommus:
    maxItems: 1

required:
  - compatible
  - amd,rpu

additionalProperties: false

examples:
  - |
    /*
     * Device and firmware DMA heaps described as named reserved-memory
     * pools; the amdrnpu node references them by phandle + name.
     */
    reserved-memory {
        #address-cells = <2>;
        #size-cells = <2>;
        ranges;

        dev_pool: buffer@50000000000 {
            compatible = "shared-dma-pool";
            reg = <0x500 0x0 0x1 0x0>;
            reusable;
        };

        fw_pool: buffer@20000000 {
            compatible = "shared-dma-pool";
            reg = <0x0 0x20000000 0x0 0x20000000>;
            reusable;
        };
    };

    r5f_0: r5f@0 {
        compatible = "xlnx,zynqmp-r5f";
    };

    amdrnpu {
        compatible = "amd,amdrnpu";
        amd,rpu = <&r5f_0>;
        memory-region = <&dev_pool>, <&fw_pool>;
        memory-region-names = "device", "firmware";
    };
