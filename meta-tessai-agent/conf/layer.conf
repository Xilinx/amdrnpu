#
# meta-tessai-agent layer configuration.

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "tessai-agent"
BBFILE_PATTERN_tessai-agent = "^${LAYERDIR}/"
BBFILE_PRIORITY_tessai-agent = "10"

LAYERSERIES_COMPAT_tessai-agent = "kirkstone langdale mickledore nanbield scarthgap styhead walnascar"
LAYERDEPENDS_tessai-agent = "core"
LAYERVERSION_tessai-agent = "1"

# Resolve the path of the source tree this layer ships with. The layer is
# expected to live inside the tessai-agent repository at <repo>/meta-tessai-agent,
# so the repository root is one directory above LAYERDIR. Recipes in this
# layer reference TESSAI_AGENT_SRC to build out of that tree by default; users
# embedding the repo elsewhere can override TESSAI_AGENT_SRC in local.conf.
TESSAI_AGENT_SRC ?= "${LAYERDIR}/.."
