; Sample amdrnpu userspace configuration.
;
; Installed to /etc/amdrnpu.ini (override the path with $AMDRNPU_INI).
; All numbers accept hex (0x...) or decimal.  Addresses/sizes must match the
; board's device tree: the pool regions are "no-map" reserved-memory, and the
; [rpmsg] geometry must match the RPU firmware's OpenAMP/virtio layout.
;
; The values below mirror lib/examples/README-inout-example.md.  EDIT THEM to
; match your target before use.

; Device-memory pool (AMDRNPU_MEMORY_DEVICE). Allocated in 4 KiB units.
[pool.device]
base = 0x50000000000
size = 0x100000000

; RPU/firmware-memory pool (AMDRNPU_MEMORY_RPU).
[pool.rpu]
base = 0x20000000
size = 0x20000000

; rpmsg_lite shared-memory geometry. Offsets are relative to shm_phys.
[rpmsg]
shm_phys        = 0x09800000   ; physical base of the mapped shared region
shm_size        = 0xA8000      ; total mapped length (also bounds-checks offsets)
status_offset   = 0x0          ; virtio status byte offset within the region
vring_rx_offset = 0x60000      ; OpenAMP vq[0] rvq (0x09860000 - shm_phys)
vring_tx_offset = 0x64000      ; OpenAMP vq[1] svq (0x09864000 - shm_phys)
vring_num       = 256          ; descriptors per ring (power of two)
vring_align     = 4096
buf_offset      = 0x68000      ; buffer pool (0x09868000 - shm_phys)
buf_size        = 512          ; bytes per rpmsg buffer (incl. 16-byte header)
buf_count       = 512          ; total buffers, even; half RX / half TX
