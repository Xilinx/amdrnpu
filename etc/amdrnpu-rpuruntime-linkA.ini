; ===========================================================================
; amdrnpu userspace config TEMPLATE for the RPURuntime "Link A" transport
; (APU  <->  RPU-APP, the "amdrnpu" RPMsg endpoint on R52 cluster-0 core-1).
;
; Derived from RPURuntime:
;   platform/dts/reserved.dtsi                      (physical memory map)
;   zephyr/subsys/ipc/open-amp/resource_table.{c,h} (resource-table layout)
;   xrt/src/driver/src/rpmsg_platform.c             (vring num/align convention)
;
; >>> This is a STARTING POINT. Verify every address/offset against YOUR
; >>> firmware build and device tree before trusting it. Items most likely to
; >>> need changes are marked "ADJUST".
; ===========================================================================
;
; Link A shared memory (OCM Bank 1), from reserved.dtsi:
;   apu_rsctbl       0xBBF80000  0x01000   resource table (vdev + 2 vrings hdr)
;   apu_rpmsg_shmem  0xBBF81000  0x48000   vrings + rpmsg buffer pool
;   (apu_rsctbl MPU span = 0x49000 covers both; they are contiguous.)
;
; The amdrnpu library maps ONE region and expresses every offset relative to
; shm_phys, so shm_phys is set to the resource-table base (0xBBF80000) and the
; vring/buffer offsets fall in the 0x1000.. range (the apu_rpmsg_shmem part).
;
; -------- virtio status byte (status_offset) --------
; The status byte lives in the resource table, inside the fw_rsc_vdev entry.
; Byte layout of struct fw_resource_table (all METAL_PACKED), no RAM_CONSOLE:
;   0x00  resource_table hdr : ver,num,reserved[2]            (16 B)
;   0x10  offset[RSC_TABLE_NUM_ENTRY=1]                        ( 4 B)
;   0x14  fw_rsc_vdev: type,id,notifyid,dfeatures,gfeatures,config_len (24 B)
;   0x2C  fw_rsc_vdev.status  <-- the virtio status byte       ( 1 B)
; => status_offset = 0x2C.
; ADJUST: if the firmware enables CONFIG_RAM_CONSOLE the offset[] array grows
; by one entry (4 B) and the vdev shifts, making status_offset = 0x30.
;
; -------- vring direction mapping --------
; resource_table.h:  vring0.da = VRING_TX_ADDRESS,  vring1.da = VRING_RX_ADDRESS
; rpmsg_lite leader: vring_rx_offset <- VRING_TX_ADDRESS (vring0)
;                    vring_tx_offset <- VRING_RX_ADDRESS (vring1)
; Fixed-address convention (as in rpmsg_platform.c): vring0 at shmem+0,
; vring1 one page later at shmem+0x1000, buffers after that.
;   vring0 (leader RX): 0xBBF81000  -> offset 0x1000
;   vring1 (leader TX): 0xBBF82000  -> offset 0x2000
;   buffers           : 0xBBF83000  -> offset 0x3000
;
; vring num/align and buffer count come from the firmware Kconfig:
;   CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF = 8  -> vring_num = 8
;   VRING_ALIGNMENT = 16, RPMSG buffer size = 512
;   total buffers = 2 * vring_num = 16  (half RX, half TX)
;
; !!! IMPORTANT INTEGRATION NOTE !!!
; In the stock resource table VRING_*_ADDRESS = -1 (the Linux-kernel master
; allocates the vrings). The amdrnpu library is a *userspace* virtio driver and
; does NOT write vring addresses back into the resource table -- it just uses
; the fixed offsets below. So the RPU-APP firmware must locate its vrings at
; these SAME fixed addresses (as rpmsg_platform.c already does for Protocol 1),
; or the leader must be extended to populate vring0/vring1 .da before DRIVER_OK.

[rpmsg]
shm_phys        = 0xBBF80000   ; apu_rsctbl base (resource table + vrings + bufs)
shm_size        = 0x49000      ; apu_rsctbl MPU span (rsctbl 0x1000 + shmem 0x48000)
status_offset   = 0x2C         ; fw_rsc_vdev.status (0x30 if CONFIG_RAM_CONSOLE)
vring_rx_offset = 0x1000       ; vring0 @ 0xBBF81000 (VRING_TX_ADDRESS slot)
vring_tx_offset = 0x2000       ; vring1 @ 0xBBF82000 (VRING_RX_ADDRESS slot)
vring_num       = 8            ; CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF
vring_align     = 16           ; VRING_ALIGNMENT
buf_offset      = 0x3000       ; buffer pool @ 0xBBF83000
buf_size        = 512          ; RPMSG buffer size (incl. 16-byte header)
buf_count       = 16           ; 2 * vring_num (half RX / half TX)

; ===========================================================================
; Device/RPU memory pools for amdrnpu_buf_alloc (ifm/ofm, etc.).
;
; These must be "no-map" reserved-memory that the kernel does NOT manage, so
; the amdrnpu 4 KiB bitmap allocator can own them exclusively and reach them
; through /dev/mem. ADJUST to real carveouts on your board.
;
; reserved.dtsi reference points:
;   rpu_gem_cma  0x20000000  0x20000000 (512 MiB)  RPU-APP-reachable (NOCACHE),
;                but it is a Linux shared-dma-pool (CMA) -- do NOT point a pool
;                at the live CMA range; carve a dedicated no-map sub-region.
; ===========================================================================

[pool.rpu]                     ; AMDRNPU_MEMORY_RPU (firmware-reachable)
base = 0x20000000              ; ADJUST: dedicated no-map carveout the RPU can see
size = 0x10000000              ; ADJUST (256 MiB here)

[pool.device]                  ; AMDRNPU_MEMORY_DEVICE (accelerator/device)
base = 0x30000000              ; ADJUST: dedicated no-map carveout
size = 0x10000000              ; ADJUST (256 MiB here)
