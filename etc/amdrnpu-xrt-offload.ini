; SPDX-License-Identifier: MIT
; ===========================================================================
; amdrnpu userspace config for the XRT/AIE offload host
; (amdrnpu_xrt_offload_example) over RPURuntime "Link A"
; (APU <-> RPU_APP, the "amdrnpu" RPMsg endpoint on R52 cluster-0 core-1).
;
; Point the host at this file with:   --ini /path/to/amdrnpu-xrt-offload.ini
;                             or:     AMDRNPU_INI=/path/to.ini <host>
; Mapping the shared memory / pools via /dev/mem typically needs root.
;
; Derived from:
;   RPURuntime/platform/dts/reserved.dtsi            (apu_rsctbl 0xBBF80000/0x49000)
;   the APU device tree vdev slots (cortexa78-linux.dts):
;       vdev0vring0@bbf81000  vdev0vring1@bbf85000  vdev0buffer@bbf89000
;   RPURuntime/zephyr/.../resource_table.h           (VRING_ALIGNMENT=16; num=Kconfig)
;
; >>> Verify the vring geometry + pools against YOUR firmware build. The vring
; >>> DIRECTION and NUM must match the RPU_APP, and the pools must be dedicated
; >>> no-map reserved-memory the RPU/AIE can reach.  Items to check are "ADJUST".
; ===========================================================================

[rpmsg]
; Link A shared memory = apu_rsctbl region (resource table + vrings + buffers).
; The library maps ONE region (shm_phys..shm_phys+shm_size) and expresses every
; offset below relative to shm_phys.
shm_phys        = 0xBBF80000   ; apu_rsctbl base (OCM Bank 1)
shm_size        = 0x49000      ; apu_rsctbl MPU span (rsctbl 0x1000 + shmem 0x48000)

; virtio status byte, inside fw_rsc_vdev of the resource table.
; status_offset = 0x2C with no RAM console; 0x30 if CONFIG_RAM_CONSOLE is set.
status_offset   = 0x2C         ; ADJUST to 0x30 if firmware has RAM_CONSOLE

; Vring direction: resource_table maps vring0.da=VRING_TX, vring1.da=VRING_RX,
; and the rpmsg-lite LEADER swaps them, so:
;   leader RX = vring0 (firmware TX)  @ 0xBBF81000 -> offset 0x1000
;   leader TX = vring1 (firmware RX)  @ 0xBBF85000 -> offset 0x5000
;   buffers                          @ 0xBBF89000 -> offset 0x9000
vring_rx_offset = 0x1000       ; vring0 (leader consumes RPU_APP output)
vring_tx_offset = 0x5000       ; vring1 (leader produces commands to RPU_APP)
buf_offset      = 0x9000       ; rpmsg buffer pool

; num/align/buffer sizing from the firmware OpenAMP Kconfig:
;   CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF = 8 -> vring_num = 8
;   VRING_ALIGNMENT = 16, RPMSG buffer size = 512, total buffers = 2*vring_num
vring_num       = 8            ; ADJUST if the firmware uses a different count
vring_align     = 16
buf_size        = 512
buf_count       = 16           ; 2 * vring_num (half RX / half TX)

; ===========================================================================
; Memory pools for amdrnpu_buf_alloc():
;   AMDRNPU_MEMORY_RPU    -> ELF, descriptor, result buffers (firmware-reachable)
;   AMDRNPU_MEMORY_DEVICE -> IFM/OFM/WTS kernel-arg buffers (AIE/NPU-reachable)
;
; These MUST be dedicated "no-map" reserved-memory the kernel does NOT manage,
; so the amdrnpu bitmap allocator owns them and reaches them via /dev/mem.
; The values below are carved from the rpu_gem_cma window (0x20000000, 512 MiB
; in reserved.dtsi) purely as a starting point -- do NOT point a pool at the
; LIVE Linux CMA range; reserve a dedicated no-map sub-region on your board.
; ===========================================================================

[pool.rpu]                     ; ELF / descriptor / result (RPU-reachable)
base = 0x20000000              ; ADJUST: dedicated no-map carveout the RPU can see
size = 0x08000000              ; 128 MiB

[pool.device]                  ; IFM / OFM / WTS (AIE/NPU-reachable)
base = 0x28000000              ; ADJUST: dedicated no-map carveout
size = 0x08000000              ; 128 MiB
