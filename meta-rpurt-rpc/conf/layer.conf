#
# meta-rpurt-rpc layer configuration.

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "rpurt-rpc"
BBFILE_PATTERN_rpurt-rpc = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpurt-rpc = "10"

LAYERSERIES_COMPAT_rpurt-rpc = "kirkstone langdale mickledore nanbield scarthgap styhead walnascar"
LAYERDEPENDS_rpurt-rpc = "core"
LAYERVERSION_rpurt-rpc = "1"

# Resolve the path of the source tree this layer ships with. The layer is
# expected to live inside the rpu-rt-rpc repository at <repo>/meta-rpurt-rpc,
# so the repository root is one directory above LAYERDIR. Recipes in this
# layer reference RPURT_RPC_SRC to build out of that tree by default; users
# embedding the repo elsewhere can override RPURT_RPC_SRC in local.conf.
RPURT_RPC_SRC ?= "${LAYERDIR}/.."
