#
# meta-amdrnpu layer configuration.

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "amdrnpu"
BBFILE_PATTERN_amdrnpu = "^${LAYERDIR}/"
BBFILE_PRIORITY_amdrnpu = "10"

LAYERSERIES_COMPAT_amdrnpu = "kirkstone langdale mickledore nanbield scarthgap styhead walnascar"
LAYERDEPENDS_amdrnpu = "core"
LAYERVERSION_amdrnpu = "1"

# Resolve the path of the source tree this layer ships with. The layer is
# expected to live inside the amdrnpu repository at <repo>/meta-amdrnpu,
# so the repository root is one directory above LAYERDIR. Recipes in this
# layer reference AMDRNPU_SRC to build out of that tree by default; users
# embedding the repo elsewhere can override AMDRNPU_SRC in local.conf.
AMDRNPU_SRC ?= "${LAYERDIR}/.."
